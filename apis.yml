apis:
- aid: cometchat:cometchat-realtime-sdk
  name: CometChat Realtime & Client SDK
  tags:
  - Real-Time
  - WebSocket
  - SDK
  - Presence
  tags_raw:
  - Realtime
  - WebSocket
  - SDK
  - Presence
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.cometchat.com/docs/sdk/javascript/overview
  baseURL: https://{appId}.api-{region}.cometchat.io/v3
  properties:
  - url: https://www.cometchat.com/docs/sdk/javascript/overview
    type: Documentation
  - url: https://www.cometchat.com/docs/sdk/javascript/managing-web-sockets-connections-manually
    type: Documentation
  description: >-
    Client SDKs (JavaScript, React, React Native, Android, iOS, Flutter, Ionic) connect over a managed
    WebSocket layer for realtime message delivery, typing indicators, presence, and read receipts. The
    socket is established and maintained by the SDK via connect()/disconnect(); CometChat does not publish
    a raw wss endpoint or message protocol.
